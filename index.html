<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="Vertex Racing 3D">
  <title>Vertex Racing 3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="security.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" defer></script>
  <script src="game.js?v=20260922-racing3d" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>🏎️</span><div><strong>Vertex Racing 3D</strong><small>Vertex Games</small></div></div>
    <button id="restartBtn">إعادة</button>
  </header>

  <main class="page">
    <section class="hero">
      <span>HIGH SPEED</span>
      <h1>Vertex Racing 3D</h1>
      <p>سباق 3D حقيقي: سرّع، فرمل، لف، وتفادى السيارات على الطريق.</p>
    </section>

    <section class="game-layout">
      <aside class="panel">
        <div><span>النقاط</span><strong id="score">0</strong></div>
        <div><span>السرعة</span><strong><span id="speed">0</span> km/h</strong></div>
        <div><span>أفضل نتيجة</span><strong id="best">0</strong></div>
        <p>W / ↑ للتسارع، S / ↓ للفرامل، و A D أو ← → للتوجيه.</p>
      </aside>

      <section class="game-card">
        <canvas id="gameCanvas" width="960" height="600"></canvas>
        <div id="overlay" class="overlay show">
          <div>
            <span id="overlayIcon">🏁</span>
            <h2 id="overlayTitle">جاهز للسباق؟</h2>
            <p id="overlayText">قد بأقصى سرعة، لف بحرية، وتفادى السيارات.</p>
            <button id="startBtn">ابدأ السباق</button>
          </div>
        </div>
      </section>
    </section>

    <section class="mobile-controls">
      <button data-key="ArrowUp">↑</button>
      <div>
        <button data-key="ArrowLeft">←</button>
        <button data-key="ArrowDown">↓</button>
        <button data-key="ArrowRight">→</button>
      </div>
    </section>
  </main>

  <footer>Vertex Systems AI © 2026</footer>
</body>
</html>
